<!DOCTYPE html>
<html lang="en">
<head>
    <title>GPA Calculator</title>
         <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
</head>
<style>
    body{
        background-color: rgb(137, 118, 137);
    }
</style>
<body>

    <div class="col-6 rounded-4 mx-auto shadow-lg my-4 p-3">
        <h2 class="fs-2 text-dark">GPA Calculator</h2>

        <input class="form-control mb-3" type="text" id="course" placeholder="Course Name">
        <input class="form-control mb-3" type="number" id="unit" placeholder="Course Unit">
        <input  class="form-control mb-3"type="text" id="grade" placeholder="Grade (A-F)">
        
        <button class="btn btn-danger" onclick="addCourse()">Add Course</button>
        <button class="btn btn-secondary" onclick="calculateGPA()">Calculate GPA</button>

        <ul id="courseList"></ul>

        <h3 id="result"></h3>
    </div>

<script src="./script/script.js"></script>
</body>
</html>
